version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: |
        bash -c 'mongosh --host mongodb --port 27017 --eval "try { rs.status() } catch (err) { rs.initiate({\"_id\": \"rs0\", \"members\": [{\"_id\": 0, \"host\": \"mongodb:27017\"}]}) }"'
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 90s

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    environment:
      - ORDER_SERVICE_HOST=order-service
      - USER_SERVICE_HOST=user-service
      - INVENTORY_SERVICE_HOST=inventory-service
    networks:
      - app-network

  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "4001:4001"
    env_file:
      - ./inventory-service/.env
    environment:
      - MONGO_DB_URI=mongodb:27017/inventory-service
      - MONGO_DB_REPLICA_SET=rs0
      - MONGO_DB=inventory-service
      - REDIS_HOSTS=redis:6379
      - BROKERS=kafka:9092
    networks:
      - app-network
    depends_on:
      - kafka
      - zookeeper

  order-service:
    build:
      context: ./order-service
    ports:
      - "4002:4002"
    env_file:
      - ./order-service/.env
    environment:
      - MONGO_DB_URI=mongodb:27017/order-service
      - MONGO_DB_REPLICA_SET=rs0
      - MONGO_DB=order-service
      - BROKERS=kafka:9092
      - INVENTORY_SERVICE_HOST=inventory-service
    networks:
      - app-network
    depends_on:
      - kafka
      - zookeeper

  user-service:
    build:
      context: ./user-service
    ports:
      - "4003:4003"
    env_file:
      - ./user-service/.env
    environment:
      - MONGO_DB_URI=mongodb:27017/user-service
      - MONGO_DB_REPLICA_SET=rs0
      - MONGO_DB=user-service
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

# monitoring tools
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app-network
    depends_on:
      - prometheus

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge